# Build the pkgdown site and publish it to GitHub Pages.
#
# Same shape as the r-lib workflow, with the GDAL and PROJ step the check
# workflow uses: pkgdown loads adgl to build the reference pages and runs the
# examples, so the whole stack has to be installed here too, GDAL7 included.
# The site is built into docs/ and pushed to the gh-pages branch, which is
# what Settings > Pages is pointed at.

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-26.04

    # A pull request builds the site to prove it still builds, and deploys
    # nothing. Only the real branch needs serialising.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install GDAL and PROJ
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
